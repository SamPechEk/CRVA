name: Reportar un error
description: Describe un problema reproducible del cotizador.
title: '[Error] '
body:
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      description: Incluye pantalla, modelo y operación. Omite datos de clientes y credenciales.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado observado
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Navegador y dispositivo
      placeholder: Chrome, Android; o Firefox, computadora
